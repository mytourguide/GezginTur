# GitHub'a her push'ta > Cloudflare Workers'a otomatik frontend dagitimi.
#
# GEREKLI GitHub Secrets (Depo > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare hesabinizda "Workers" duzenleme yetkili token
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare hesap ID'niz
#
# NOT: Backend (Go API) Cloudflare'de CALISMAZ. API'nin herkese acik bir adreste
# durmasi gerekir (VPS, Railway, Render vb.). Asagidaki env'ler GitHub Actions'da
# Repository variables olarak tanimlanmali:
#   NEXT_PUBLIC_API_URL = https://api.sizinsiteniz.com/api/v1
#   API_INTERNAL_URL    = https://api.sizinsiteniz.com      (rewrite hedefi)

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # OpenNext derlemesi (Next.js -> Cloudflare Workers uyumlu cikti)
      - name: Build (OpenNext/Cloudflare)
        working-directory: frontend
        run: |
          npm ci
          npx --yes install-only-dependency @opennextjs/cloudflare@latest >/dev/null 2>&1 || true
          npx --yes @opennextjs/cloudflare build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_SERVICE_ID: ${{ vars.NEXT_PUBLIC_APPLE_SERVICE_ID }}

      - name: Deploy
        working-directory: frontend
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
